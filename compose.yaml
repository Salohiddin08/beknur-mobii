services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: beknur_mobii
      POSTGRES_USER: beknur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U beknur -d beknur_mobii']
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://beknur:${POSTGRES_PASSWORD}@db:5432/beknur_mobii
      TRUST_PROXY: 'true'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - appdata:/app/.local
  bot:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://beknur:${POSTGRES_PASSWORD}@db:5432/beknur_mobii
    command: [node, --experimental-strip-types, scripts/bot.ts]
    depends_on:
      db:
        condition: service_healthy
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy_config:/config
    depends_on: [web]
volumes:
  database:
  appdata:
  certificates:
  caddy_config:
